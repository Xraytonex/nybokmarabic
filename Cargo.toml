[package]
name = "nybokmarabic"
version = "0.1.0"
edition = "2021"
description = "Nybokmarabic: Bokmål, Nynorsk and Arabic, finally merged. A deterministic inflection and identifier-translation CLI."
license = "MIT"
readme = "README.md"
default-run = "nbma"

[[bin]]
name = "nbma"
path = "src/main.rs"

[lib]
name = "nbma"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = { version = "0.8", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1

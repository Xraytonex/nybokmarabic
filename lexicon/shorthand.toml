# Shorthand that identifiers use (SPEC §16). Embedded in the CLI at build time.
#
# [abbreviations] maps an identifier word to the English words it stands for.
# Every word of an expansion must itself be in the lexicon (`nbma lexicon
# check` enforces this), so the Norwegian still comes from verified entries.
# A plural (`kwargs`, `fds`) is read from its singular here.
#
# [acronyms] are kept as written and inflected as neuter nouns, with the
# Norwegian hyphen before every ending: ad-det-HTTP-et, HTTP-er.
#
# Neither list is checked against ordbokene.no: there is nothing Norwegian in
# them to check.

[abbreviations]
abbr = "abbreviation"
acct = "account"
admin = "administrator"
amt = "amount"
app = "application"
arc = "archive"
attr = "attribute"
auth = "authentication"
auto = "automatic"
